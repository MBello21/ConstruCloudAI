<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#172554"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Hard hat / construction icon -->
  <g transform="translate(32,30)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hat dome -->
    <path d="M-14,4 C-14,-8 -8,-14 0,-14 C8,-14 14,-8 14,4" fill="white" fill-opacity="0.15"/>
    <path d="M-14,4 C-14,-8 -8,-14 0,-14 C8,-14 14,-8 14,4"/>
    <!-- Hat brim -->
    <path d="M-17,4 L17,4" stroke-width="3"/>
    <!-- Hat stripe -->
    <line x1="-10" y1="-2" x2="10" y2="-2" stroke-width="2"/>
    <!-- Vertical line on hat -->
    <line x1="0" y1="-14" x2="0" y2="-2" stroke-width="2"/>
  </g>
  <!-- AI sparkle -->
  <g transform="translate(47,14)" fill="white">
    <circle cx="0" cy="0" r="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="1.5"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="white" stroke-width="1.5"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="white" stroke-width="1"/>
    <line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" stroke="white" stroke-width="1"/>
  </g>
  <!-- AI text -->
  <text x="32" y="54" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" letter-spacing="1">AI</text>
</svg>
